component: scf
name: bexino-site
app: bexino-site
stage: production
inputs:
  name: bexino-site
  region: ap-guangzhou
  type: web
  runtime: Nodejs16.13
  src: ./.scf-package
  entryFile: app.js
  memorySize: 128
  timeout: 10
  events:
    - http:
        parameters:
          netConfig:
            enableIntranet: false
            enableExtranet: true
          qualifier: $DEFAULT
          authType: NONE
