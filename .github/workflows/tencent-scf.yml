name: Deploy to Tencent Cloud SCF

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Cache homepage data]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tencent-scf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tencentcloud-sdk-python-scf
      - name: Prepare function package
        run: |
          mkdir -p .scf-package/site
          cp scripts/scf-server.cjs .scf-package/app.js
          cp scripts/scf_bootstrap .scf-package/scf_bootstrap
          chmod 755 .scf-package/scf_bootstrap
          cp -R dist/. .scf-package/site/
          cd .scf-package
          zip -qr ../scf.zip .
      - name: Update existing function
        run: python scripts/deploy-scf.py scf.zip
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          SCF_FUNCTION_NAME: ${{ vars.SCF_FUNCTION_NAME }}
          SCF_NAMESPACE: ${{ vars.SCF_NAMESPACE }}
          SCF_REGION: ${{ vars.SCF_REGION }}
